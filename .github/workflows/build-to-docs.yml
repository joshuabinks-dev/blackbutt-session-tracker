  name: Build to /docs (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "build-docs"
  cancel-in-progress: true

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # ✅ Force devDependencies to install
      - name: Install (include dev deps)
        run: npm ci --include=dev --no-audit --no-fund

      
      - name: Show npm config omit
        run: npm config get omit || true

      # ✅ Optional sanity check (leave in for now)
      - name: Verify TypeScript installed
        run: ls -la node_modules/typescript/bin/tsc

      - name: Build
        run: npm run build

      - name: Replace /docs with dist output
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R dist/* docs/
          cp docs/index.html docs/404.html

      - name: Commit /docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Build: publish to /docs" || echo "No changes to commit"
          git push
